<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaForce-Nord Werbespot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=block" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#e8edf3; --muted:#7c8796; --btn:#141a22; --accent:#4cc9f0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px Inter,system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px 16px; }
  canvas { height:calc(100vh - 80px); max-width:100%; aspect-ratio:9/16; background:#000; border-radius:12px; display:block; cursor:pointer; }
  .bar { display:flex; gap:8px; align-items:center; width:min(100%, 460px); flex-wrap:wrap; }
  .bar button { background:var(--btn); color:#fff; border:0; border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  .bar input { flex:1; accent-color:var(--accent); min-width:120px; }
  .bar span { font-variant-numeric:tabular-nums; color:var(--muted); width:44px; text-align:right; }
  #status { color:var(--muted); }
  body.export { padding:0; display:block; background:transparent; }
  body.export .bar, body.export #status { display:none; }
  body.export canvas { height:auto; width:1080px; border-radius:0; background:transparent; }
</style>
</head>
<body>
<div id="status">Texturen werden berechnet …</div>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">Pause</button>
  <button id="safe" title="Taste S">Safe Zones</button>
  <input id="seek" type="range" min="0" max="30" step="0.01" value="0">
  <span id="time">0.00</span>
</div>
<audio id="music" src="soundtrack.wav" preload="auto"></audio>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  AquaForce-Nord · Premium-Werbespot · 30 s · 1080×1920 · 30 fps
//
//  Komplett prozedural: Steintexturen (Heightmap → Normalen → Licht), eine
//  geneigte Lochkamera über der Bodenebene, Wasserstrahl als 3D-Partikel mit
//  Zeitlupe, Typografie. render(t) ist deterministisch → MP4 via render.mjs.
//
//  Szenen
//   0.0– 4.0  Lichtstrahl, Tropfen, „Schmutz hinterlässt Spuren."
//   4.0– 9.0  Verschmutzte Terrassenplatte, Streiflicht, Kamerafahrt
//   9.0–16.0  Wasserstrahl reinigt die Fläche (Zeitlupe 10.4–13.6)
//  16.0–22.0  Ergebnis: Terrassen. / Einfahrten. / Pflasterflächen.
//  22.0–30.0  Logo-Reveal, „Deine Fläche. Wie neu.", Call-to-Action
//
//  Logo: assets/logo.png (oder .svg) wird unverändert eingesetzt.
//  ?layer=overlay → nur Schrift + Logo auf Transparenz (für Higgsfield-Footage)
// ─────────────────────────────────────────────────────────────────────────────
const W = 1080, H = 1920, FPS = 30, DUR = 30;
const CX = 530;                     // optische Mitte (rechte UI-Spalte meiden)
const TEXT_MAX = 720;               // max. Textbreite → x 170 … 890
const params = new URLSearchParams(location.search);
const EXPORT = params.has('export');
const OVERLAY = params.get('layer') === 'overlay';
if (EXPORT) document.body.classList.add('export');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const FONT = '"Inter", "Inter Display", "SF Pro Display", system-ui, sans-serif';

// ── Helfer ──────────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeOutExpo = k => (k = clamp(k)) === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const env = (t, a, b, fi, fo) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hash = i => rng(i * 7919 + 17)();
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ── Prozedurale Steintexturen ───────────────────────────────────────────────
const TW = 2400, TH = 3200, NPX = TW * TH;

// kachelbares (in x) Value-Noise als Feld über die ganze Textur
function noiseField(seed, cellsX, octaves, gain = .5) {
  const out = new Float32Array(NPX);
  let amp = 1, norm = 0, cx = cellsX;
  const r = rng(seed);
  for (let o = 0; o < octaves; o++) {
    const cs = TW / cx, cy = Math.ceil(TH / cs) + 2;
    const g = new Float32Array(cx * cy);
    for (let i = 0; i < g.length; i++) g[i] = r();
    for (let y = 0; y < TH; y++) {
      const fy = y / cs, iy = fy | 0; let ty = fy - iy; ty = ty * ty * (3 - 2 * ty);
      const r0 = iy * cx, r1 = (iy + 1) * cx, row = y * TW;
      for (let x = 0; x < TW; x++) {
        const fx = x / cs, ix = fx | 0; let tx = fx - ix; tx = tx * tx * (3 - 2 * tx);
        const ix1 = (ix + 1) % cx;
        const a = g[r0 + ix] + (g[r0 + ix1] - g[r0 + ix]) * tx;
        const b = g[r1 + ix] + (g[r1 + ix1] - g[r1 + ix]) * tx;
        out[row + x] += (a + (b - a) * ty) * amp;
      }
    }
    norm += amp; amp *= gain; cx *= 2;
  }
  for (let i = 0; i < NPX; i++) out[i] /= norm;
  return out;
}

// Verlegemuster zeichnen → {id: scharf, bevel: weichgezeichnet}
function layout(kind) {
  const P = 64, c = mk(TW + 2 * P, TH), g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  const r = rng(kind.length * 1013 + 7);
  const stone = (x, y, w, h, rad = 3, rot = 0) => {
    g.fillStyle = `rgb(255,${(r() * 255) | 0},${(r() * 255) | 0})`;
    for (const off of [-TW, 0, TW]) {
      g.save(); g.translate(P + off + x + w / 2, y + h / 2); g.rotate(rot);
      g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, rad); g.fill(); g.restore();
    }
  };
  let blur;
  if (kind === 'slabs') {               // Terrassenplatten 50×50 cm, Halbverband
    const S = 400, gap = 7;
    for (let row = 0; row * S < TH + S; row++)
      for (let col = -1; col * S < TW + S; col++) {
        const x = col * S + (row % 2 ? S / 2 : 0);
        stone(x + gap / 2, row * S + gap / 2, S - gap, S - gap, 4);
      }
    blur = 4;
  } else if (kind === 'herring') {      // Betonpflaster im Fischgrätverband
    const u = 75, gap = 5;
    for (let s = -40; s <= 40; s++)
      for (let k = -60; k <= 60; k++) {
        const hx = (k + 2 * s) * u, hy = (k - 2 * s) * u;
        if (hx > -3 * u && hx < TW + u && hy > -3 * u && hy < TH + u) {
          stone(hx + gap / 2, hy + gap / 2, 2 * u - gap, u - gap, 3);
          stone(hx + gap / 2, hy + u + gap / 2, u - gap, 2 * u - gap, 3);
        }
      }
    blur = 3;
  } else {                              // Granit-Kleinpflaster, Reihenverband
    let y = 0;
    while (y < TH) {
      const rh = 82 + r() * 26; const ws = []; let sum = 0;
      while (sum < TW) { const w = 78 + r() * 64; ws.push(w); sum += w; }
      const k = TW / sum; let x = r() * 40;
      for (const w0 of ws) { const w = w0 * k, gp = 9 + r() * 6;
        stone(x + gp / 2, y + gp / 2, w - gp, rh - gp, 16, (r() - .5) * .06); x += w; }
      y += rh;
    }
    blur = 9;
  }
  const id = g.getImageData(P, 0, TW, TH).data;
  const b = mk(c.width, c.height), bg = b.getContext('2d');
  bg.filter = `blur(${blur}px)`; bg.drawImage(c, 0, 0);
  const bevel = bg.getImageData(P, 0, TW, TH).data;
  return { id, bevel };
}

let NF;  // geteilte Rauschfelder
function bakeTextures(kind, variants) {
  const { id, bevel } = layout(kind);
  const [N1, N2, N3] = NF;
  const hgt = new Float32Array(NPX);
  const wr = rng(99 + kind.length);
  const white = new Float32Array(NPX); for (let i = 0; i < NPX; i++) white[i] = wr();
  const dirty = variants.includes('dirty');
  // Moos/Schmutz-Maske (nur für die verschmutzte Variante)
  const moss = dirty ? new Float32Array(NPX) : null;
  const bev = kind === 'cobble' ? 1.6 : 1.0;
  for (let i = 0; i < NPX; i++) {
    const m = bevel[i * 4] / 255;
    let h = Math.pow(m, kind === 'cobble' ? .6 : .9) * bev + (N3[i] - .5) * .22 + (white[i] - .5) * .05 + (N2[i] - .5) * .25;
    hgt[i] = h;
    if (dirty) {
      const joint = 1 - sstep(.35, .85, m);
      const mm = clamp(joint * 1.2 * sstep(.2, .7, N2[i] + N3[i] * .5) + sstep(.66, .86, N1[i] * .6 + N2[i] * .25 + N3[i] * .35) * .32);
      moss[i] = mm;
    }
  }
  const out = {};
  for (const variant of variants) {
    const tex = mk(TW, TH), tg = tex.getContext('2d');
    const img = tg.createImageData(TW, TH), d = img.data;
    const wet = variant === 'wet';
    const glossC = wet ? mk(TW, TH) : null;
    const gimg = wet ? glossC.getContext('2d').createImageData(TW, TH) : null, gd = gimg && gimg.data;
    // Licht in Texturkoordinaten: x rechts, y zur Kamera, z hoch – Streiflicht von hinten links
    let lx = -.62, ly = -.5, lz = .48; const ln = Math.hypot(lx, ly, lz); lx /= ln; ly /= ln; lz /= ln;
    for (let y = 0; y < TH; y++) {
      const ym = y > 0 ? y - 1 : y, yp = y < TH - 1 ? y + 1 : y;
      for (let x = 0; x < TW; x++) {
        const i = y * TW + x;
        const xm = x > 0 ? i - 1 : i + TW - 1, xp = x < TW - 1 ? i + 1 : i - TW + 1;
        let hh = hgt;
        let dx = (hh[xm] - hh[xp]), dy = (hh[ym * TW + x] - hh[yp * TW + x]);
        let mh = 0;
        if (variant === 'dirty') { mh = moss[i]; dx += (moss[xm] - moss[xp]) * .35; dy += (moss[ym * TW + x] - moss[yp * TW + x]) * .35; }
        const k = 7;
        let nx = dx * k, ny = dy * k, nz = 1; const nn = Math.hypot(nx, ny, nz); nx /= nn; ny /= nn; nz /= nn;
        const dif = Math.max(0, nx * lx + ny * ly + nz * lz);
        const m = bevel[i * 4] / 255, st = id[i * 4] / 255;
        const tone = id[i * 4 + 1] / 255 - .5, tone2 = id[i * 4 + 2] / 255;
        const n1 = N1[i], n2 = N2[i], n3 = N3[i], w = white[i];
        let r, g, b;
        const stoneW = sstep(.25, .7, m);
        if (kind === 'slabs') {         // heller, warmer Betonwerkstein
          const v = .64 + tone * .07 + (n2 - .5) * .09 + (n3 - .5) * .08 + (w - .5) * .07;
          r = v * 1.02; g = v * .995; b = v * .955;
          if (w > .993) { r *= .7; g *= .7; b *= .7; }
          const jr = .40 + (n3 - .5) * .1; r = lerp(jr, r, stoneW); g = lerp(jr * .96, g, stoneW); b = lerp(jr * .88, b, stoneW);
        } else if (kind === 'herring') { // Anthrazit, nuanciert
          const base = tone2 < .55 ? .25 : tone2 < .85 ? .31 : .2;
          const v = base + tone * .04 + (n3 - .5) * .07 + (w - .5) * .06;
          r = v; g = v * 1.01; b = v * 1.05;
          const jr = .5 + (n3 - .5) * .1; r = lerp(jr, r, stoneW); g = lerp(jr * .97, g, stoneW); b = lerp(jr * .9, b, stoneW);
        } else {                         // Granit: grau / beige / blaugrau, gesprenkelt
          const pal = tone2 < .4 ? [.50, .50, .50] : tone2 < .65 ? [.56, .51, .45] : tone2 < .85 ? [.42, .45, .49] : [.55, .47, .45];
          const sp = w > .9 ? -.18 : w > .8 ? .1 : 0;
          const v = 1 + tone * .12 + (n3 - .5) * .15;
          r = pal[0] * v + sp; g = pal[1] * v + sp; b = pal[2] * v + sp;
          const jr = .22 + (n3 - .5) * .08; r = lerp(jr, r, stoneW); g = lerp(jr * .97, g, stoneW); b = lerp(jr * .9, b, stoneW);
        }
        if (variant === 'dirty') {
          // Grauschleier, Algenfilm, schwarze Flechten, Moos in den Fugen
          const grime = clamp(.55 + (n1 - .5) * 1.1 + (n2 - .5) * .5 + (1 - stoneW) * .3);
          r = lerp(r, .25, grime * .82); g = lerp(g, .27, grime * .82); b = lerp(b, .22, grime * .82);
          const algae = sstep(.38, .8, n1 * .75 + n2 * .45 - .1 + (n3 - .5) * .2);
          r = lerp(r, .19, algae * .7); g = lerp(g, .25, algae * .7); b = lerp(b, .12, algae * .7);
          const lich = sstep(.78, .81, n3 * .75 + n2 * .35 + (w - .5) * .08) * stoneW;
          r = lerp(r, .08, lich * .8); g = lerp(g, .085, lich * .8); b = lerp(b, .08, lich * .8);
          const streak = sstep(.55, .9, N1[(i + TW * 37) % NPX]) * sstep(.4, .7, n2) * .25;
          r -= streak * .12; g -= streak * .1; b -= streak * .1;
          const mv = .75 + (w - .5) * .7 + (n3 - .5) * .6;
          r = lerp(r, .17 * mv, mh); g = lerp(g, .26 * mv, mh); b = lerp(b, .07 * mv, mh);
        }
        if (wet) { r *= .82; g *= .83; b *= .85; }
        const shade = .32 + dif * 1.25;
        d[i * 4] = clamp(r * shade) * 255; d[i * 4 + 1] = clamp(g * shade) * 255; d[i * 4 + 2] = clamp(b * shade) * 255; d[i * 4 + 3] = 255;
        if (wet) {
          const face = Math.pow(nz, 9);
          const gl = clamp((stoneW * .75 + (1 - stoneW) * .9) * face * (.55 + n3 * .45) * (kind === 'cobble' ? .85 : 1));
          gd[i * 4] = 255; gd[i * 4 + 1] = 255; gd[i * 4 + 2] = 255; gd[i * 4 + 3] = gl * 255;
        }
      }
    }
    tg.putImageData(img, 0, 0);
    out[variant] = tex;
    if (wet) { glossC.getContext('2d').putImageData(gimg, 0, 0); out.gloss = glossC; }
  }
  return out;
}

// ── Kamera über der Bodenebene ──────────────────────────────────────────────
// cam: { u, v, hc, pitch (rad), f, roll }  u/v: Texturpunkt unter der Kamera
const CY = H / 2;
function rowInfo(cam, y) {
  const a = (y - CY) / cam.f, c = Math.cos(cam.pitch), s = Math.sin(cam.pitch);
  const den = a * c + s;
  if (den <= .004) return null;
  const z = cam.hc * (c - a * s) / den;
  const d = z * c + cam.hc * s;
  return { z, sc: d / cam.f };
}
function project(cam, u, hgt, v) {
  const z = cam.v - v, c = Math.cos(cam.pitch), s = Math.sin(cam.pitch);
  const hy = cam.hc - hgt, d = z * c + hy * s;
  return { x: W / 2 + cam.f * (u - cam.u) / d, y: CY + cam.f * (hy * c - z * s) / d, d };
}
function seg(g, tex, u0, u1, v, sh, y, rh, cam, sc) {
  let a = u0;
  while (a < u1 - .01) {
    const tile = Math.floor(a / TW), loc = a - tile * TW, end = Math.min(u1, (tile + 1) * TW), w = end - a;
    g.drawImage(tex, loc, v, Math.max(w, .5), sh, W / 2 + (a - cam.u) / sc, y, w / sc + .7, rh);
    a = end;
  }
}

const G = mk(W, H), gctx = G.getContext('2d');      // Boden
const GL = mk(W, H), glctx = GL.getContext('2d');   // Glanz-Maske
const TMP = mk(W, H), tctx = TMP.getContext('2d');
const BUF = [mk(W, H), mk(W, H)];
const FOG = [3, 6, 12];

/*  Boden rendern.
    o: { tex, gloss, dirty, cut(v) → u (links davon sauber), fog:[start,end], hilite(g, cam) } */
function drawGround(cam, o) {
  const g = gctx;
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = `rgb(${FOG})`; g.fillRect(0, 0, W, H);
  glctx.clearRect(0, 0, W, H);
  const [f0, f1] = o.fog || [2600, 4200];
  const RH = 2;
  let prevZ = null;
  for (let y = H - RH; y >= -RH; y -= RH) {
    const ri = rowInfo(cam, y + RH / 2);
    if (!ri) break;
    const v = cam.v - ri.z;
    if (v < 1) break;
    const fog = sstep(f0, f1, ri.z);
    if (fog > .995) break;
    const nz = rowInfo(cam, y - RH / 2);
    const sh = clamp(nz ? Math.abs(nz.z - ri.z) : 1, 1, 40);
    const vv = clamp(v, 0, TH - sh - 1);
    const half = W / 2 * ri.sc, uL = cam.u - half - 2 * ri.sc, uR = cam.u + half + 2 * ri.sc;
    if (o.cut) {
      const uc = o.cut(v);
      if (uc > uL) { seg(g, o.tex, uL, Math.min(uc, uR), vv, sh, y, RH, cam, ri.sc);
                     if (o.gloss) seg(glctx, o.gloss, uL, Math.min(uc, uR), vv, sh, y, RH, cam, ri.sc); }
      if (uc < uR) {
        seg(g, o.dirty, Math.max(uc, uL), uR, vv, sh, y, RH, cam, ri.sc);
        const X = u => W / 2 + (u - cam.u) / ri.sc, x0 = X(uc), x1 = X(uc + 110);   // Schmutzwasser-Kante
        const sg = g.createLinearGradient(x0, 0, x1, 0);
        sg.addColorStop(0, 'rgba(12,14,8,.5)'); sg.addColorStop(1, 'rgba(12,14,8,0)');
        g.fillStyle = sg; g.fillRect(x0, y, x1 - x0, RH);
      }
      if (uc > uL) {                                                                      // frisch nass
        const X = u => W / 2 + (u - cam.u) / ri.sc, x0 = X(uc - 520), x1 = X(uc);
        const wg = g.createLinearGradient(x0, 0, x1, 0);
        wg.addColorStop(0, 'rgba(4,10,18,0)'); wg.addColorStop(.7, 'rgba(4,10,18,.16)'); wg.addColorStop(1, 'rgba(4,10,18,.34)');
        g.fillStyle = wg; g.fillRect(x0, y, x1 - x0, RH);
      }
    } else {
      seg(g, o.tex, uL, uR, vv, sh, y, RH, cam, ri.sc);
      if (o.gloss) seg(glctx, o.gloss, uL, uR, vv, sh, y, RH, cam, ri.sc);
    }
    if (fog > .002) { g.fillStyle = `rgba(${FOG},${fog})`; g.fillRect(0, y, W, RH); }
  }
  // Nasse Reflexe: Glanzmaske × bewegtes Studiolicht
  if (o.gloss && o.hilite) {
    glctx.globalCompositeOperation = 'source-in';
    o.hilite(glctx, cam);
    glctx.globalCompositeOperation = 'source-over';
    g.globalCompositeOperation = 'screen'; g.drawImage(GL, 0, 0); g.globalCompositeOperation = 'source-over';
  }
}

// Tiefenunschärfe: oben (fern) stark, Fokusband, unten leicht
function dof(g, cvs, focusY, top, bottom, amount = 10) {
  tctx.clearRect(0, 0, W, H);
  tctx.filter = `blur(${amount}px)`; tctx.drawImage(cvs, 0, 0); tctx.filter = 'none';
  tctx.globalCompositeOperation = 'destination-in';
  const gr = tctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, `rgba(0,0,0,${top})`);
  gr.addColorStop(clamp((focusY - 420) / H), 'rgba(0,0,0,0)');
  gr.addColorStop(clamp((focusY + 380) / H), 'rgba(0,0,0,0)');
  gr.addColorStop(1, `rgba(0,0,0,${bottom})`);
  tctx.fillStyle = gr; tctx.fillRect(0, 0, W, H);
  tctx.globalCompositeOperation = 'source-over';
  g.drawImage(TMP, 0, 0);
}

function grade(g, opt = {}) {
  // kühle Schatten, Vignette, sanfte Abdunklung oben für Typografie
  g.globalCompositeOperation = 'soft-light';
  g.fillStyle = 'rgba(30,90,140,0.55)'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
  const v = g.createRadialGradient(W / 2, H * .52, H * .18, W / 2, H * .52, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,2,6,${opt.vig ?? .78})`);
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  if (opt.top) {
    const t = g.createLinearGradient(0, 0, 0, H * .55);
    t.addColorStop(0, `rgba(1,3,8,${opt.top})`); t.addColorStop(1, 'rgba(1,3,8,0)');
    g.fillStyle = t; g.fillRect(0, 0, W, H);
  }
}

function blit(g, src, roll = 0, zoom = 1.04) {
  g.save(); g.translate(W / 2, H / 2); g.rotate(roll); g.scale(zoom, zoom);
  g.drawImage(src, -W / 2, -H / 2); g.restore();
}

  // turbulente Gischt entlang der Aufprall-Linie
  const fr = Math.floor(st * 40);
  for (let j = 0; j < pts.length - 1; j++) {
    const a = pts[j], b = pts[j + 1];
    for (let n = 0; n < 7; n++) {
      const r = rng(j * 977 + n * 131 + fr * 7);
      const k = r(), x = lerp(a.x, b.x, k), y = lerp(a.y, b.y, k);
      const sc = cam.f / lerp(a.d, b.d, k);
      const sz = (10 + r() * 46) * sc, ox = (r() - .35) * 40 * sc, oy = -r() * 50 * sc;
      g.globalAlpha = (.12 + r() * .22) * e;
      g.drawImage(SOFT, x + ox - sz / 2, y + oy - sz / 2, sz, sz);
    }
  }
  g.globalAlpha = 1;
  g.restore();
  // Spritzer: ballistische Tropfen, Belichtungszeit folgt der Zeitlupe
  const RATE = 1100, LIFE = .55, G0 = 4200, shutter = (1 / 50) * spd;
  const i0 = Math.max(0, Math.floor((st - LIFE) * RATE)), i1 = Math.floor(st * RATE);
  const vNear = pts[0].v, vFar = pts[pts.length - 1].v;
  g.save(); g.lineCap = 'round';
  for (let i = i0; i <= i1; i++) {
    const r = rng(i * 31 + 5);
    const s0 = i / RATE; const tau = st - s0; if (tau < 0 || tau > LIFE) continue;
    const sT = JET0;  // Spawn-Position: Linie zum Spawnzeitpunkt
    const v0 = lerp(vNear + 40, vFar, Math.pow(r(), 1.3));
    const tReal = realFromSim(s0);
    const u0 = cutU(tReal, v0);
    const dir = r() < .82 ? 1 : -.45;
    const vu = dir * (120 + r() * 520), vh = 160 + r() * 820, vv = (r() - .5) * 360;
    const at = tt => ({ u: u0 + vu * tt, h: vh * tt - .5 * G0 * tt * tt, v: v0 + vv * tt });
    const p1 = at(tau); if (p1.h < -2) continue;
    const p0 = at(Math.max(0, tau - shutter));
    const a = project(cam, p1.u, Math.max(0, p1.h), p1.v), b = project(cam, p0.u, Math.max(0, p0.h), p0.v);
    const size = 2 + r() * 7;
    const lw = clamp(size * cam.f / a.d, .7, 9);
    const fade = (1 - tau / LIFE) * e;
    const dirt = r() < .16;
    g.globalCompositeOperation = dirt ? 'source-over' : 'lighter';
    g.strokeStyle = dirt ? `rgba(58,52,36,${.55 * fade})` : `rgba(215,242,255,${.6 * fade})`;
    g.lineWidth = lw;
    g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(a.x + .01, a.y); g.stroke();
  }
  g.restore();
}
const realFromSim = s => { // Umkehrung von sim() (monoton)
  let lo = 0, hi = SIM.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (SIM[m] < s) lo = m + 1; else hi = m; }
  return JET0 + lo / 600;
};

function drawMist(g, cam, t) {
  const e = jetEnvelope(t) + sstep(15.0, 16, t) * 2; if (e < .001) return;
  const st = sim(t);
  g.save(); g.globalCompositeOperation = 'lighter';
  const RATE = 70, LIFE = 1.6;
  const i0 = Math.max(0, Math.floor((st - LIFE) * RATE)), i1 = Math.floor(Math.min(st, SIM_END) * RATE);
  for (let i = i0; i <= i1; i++) {
    const r = rng(i * 13 + 901); const s0 = i / RATE, tau = st - s0; if (tau < 0 || tau > LIFE) continue;
    const v0 = cam.v - lerp(150, 1900, Math.pow(r(), 1.2));
    const u0 = cutU(realFromSim(s0), v0);
    const p = project(cam, u0 + 160 * tau + (r() - .5) * 60, 30 + 260 * tau * (.5 + r()), v0);
    const sz = clamp((140 + 380 * tau) * cam.f / p.d, 20, 900);
    g.globalAlpha = clamp(.09 * Math.sin(Math.PI * tau / LIFE) * Math.min(1, e));
    g.drawImage(SOFT, p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  g.restore();
}

// ── Szene 4: Ergebnis ───────────────────────────────────────────────────────
const SHOTS = [
  { t0: 16.0, t1: 18.15, kind: 'slabs', word: 'Terrassen.',
    cam: k => ({ u: lerp(1250, 1330, k), v: lerp(3150, 2850, k), hc: lerp(380, 340, k), pitch: lerp(44, 41, k) * Math.PI / 180, f: 1150, roll: lerp(.02, .005, k) }) },
  { t0: 18.0, t1: 20.15, kind: 'herring', word: 'Einfahrten.',
    cam: k => ({ u: lerp(900, 1260, k), v: lerp(3000, 2900, k), hc: lerp(420, 430, k), pitch: 43 * Math.PI / 180, f: 1150, roll: lerp(-.02, -.006, k) }) },
  { t0: 20.0, t1: 22.4, kind: 'cobble', word: 'Pflasterflächen.',
    cam: k => ({ u: lerp(1200, 1140, k), v: lerp(2800, 3020, k), hc: lerp(330, 470, k), pitch: lerp(41, 47, k) * Math.PI / 180, f: 1150, roll: lerp(.015, -.005, k) }) },
];
function shot(g, s, t) {
  const k = ease((t - s.t0 + .2) / (s.t1 - s.t0 + .4)) * .85 + (t - s.t0) / (s.t1 - s.t0) * .15;
  const cam = s.cam(clamp(k));
  const T = TEX[s.kind];
  drawGround(cam, { tex: T.wet, gloss: T.gloss, fog: [1500, 3400], hilite: (gx) => {
    // weiche Studio-Softbox, die über die nasse Fläche wandert
    const hx = lerp(-200, 1300, ease((t - s.t0) / (s.t1 - s.t0)));
    const fr = gx.createLinearGradient(0, 300, 0, H);
    fr.addColorStop(0, 'rgba(120,175,230,.6)'); fr.addColorStop(.5, 'rgba(80,130,190,.2)'); fr.addColorStop(1, 'rgba(60,110,170,.08)');
    gx.fillStyle = fr; gx.fillRect(0, 0, W, H);
    const r = gx.createRadialGradient(hx, 640, 0, hx, 640, 900);
    r.addColorStop(0, 'rgba(235,248,255,1)'); r.addColorStop(.35, 'rgba(150,205,245,.55)'); r.addColorStop(1, 'rgba(90,150,210,0)');
    gx.fillStyle = r; gx.fillRect(0, 0, W, H);
  } });
  dof(gctx, G, 1250, .9, .5, 8);
  blit(g, G, cam.roll, 1.05);
  grade(g, { vig: .8, top: .7 });
  const sz = fitSize(g, 'Pflasterflächen.', 700, 118, TEXT_MAX);
  line(g, [s.word], 640, sz, 700, t, s.t0 + .35, s.t1 - .55, { dur: .8 });
}
function scene4(g, t) {
  // Kurze, weiche Überblendungen zwischen den drei Einstellungen
  const active = SHOTS.filter(s => t >= s.t0 && t < s.t1);
  if (active.length === 1) { shot(g, active[0], t); return; }
  const [a, b] = active, k = sstep(b.t0, a.t1, t);
  const ca = BUF[0].getContext('2d'), cb = BUF[1].getContext('2d');
  shot(ca, a, t); shot(cb, b, t);
  g.drawImage(BUF[0], 0, 0); g.globalAlpha = k; g.drawImage(BUF[1], 0, 0); g.globalAlpha = 1;
}

// ── Szene 5: Marke ──────────────────────────────────────────────────────────
function scene5bg(g, t) {
  g.fillStyle = '#010205'; g.fillRect(0, 0, W, H);
  const p = sstep(22.0, 23.5, t);
  const gl = g.createRadialGradient(CX, 760, 0, CX, 760, 900);
  gl.addColorStop(0, `rgba(18,60,110,${.55 * p})`); gl.addColorStop(.5, `rgba(8,26,52,${.35 * p})`); gl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  // ruhige Kaustik-Lichtlinien am Boden
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const k = i / 25, y = 1500 + Math.pow(k, 1.7) * 420;
    g.beginPath();
    for (let x = -20; x <= W + 20; x += 14) {
      const yy = y + Math.sin(x * (.01 - k * .005) + t * .7 + i * 1.3) * (3 + k * 14);
      x === -20 ? g.moveTo(x, yy) : g.lineTo(x, yy);
    }
    g.strokeStyle = `rgba(80,170,240,${.07 * p * (1 - k * .5)})`; g.lineWidth = .8 + k * 1.6; g.stroke();
  }
  // schwebende Partikel (Bokeh)
  const r = rng(77);
  for (let i = 0; i < 26; i++) {
    const x = r() * W, y0 = r() * H, sp = 8 + r() * 22, s = 4 + r() * 16;
    const y = (y0 - (t - 22) * sp + H) % H;
    g.globalAlpha = (.05 + r() * .12) * p; g.drawImage(SOFT, x - s, y - s, s * 2, s * 2);
  }
  g.restore();
}
function scene5fg(g, t) {
  if (!LOGO_BOX) LOGO_BOX = renderLogoLayer();
  const lk = easeOutExpo((t - 22.45) / 1.6);
  if (lk > 0) {
    g.save(); g.globalAlpha = clamp(lk * 1.05);
    const sc = lerp(.94, 1, lk), blur = (1 - lk) * 18;
    if (blur > .3) g.filter = `blur(${blur.toFixed(1)}px)`;
    g.translate(CX, 640); g.scale(sc, sc); g.drawImage(LOGO_C, -CX, -260); g.restore();
    // Lichtkante gleitet einmal über das Logo (nur Licht, Logo bleibt unverändert)
    const sk = (t - 23.1) / 1.1;
    if (sk > 0 && sk < 1) {
      tctx.clearRect(0, 0, W, H); tctx.drawImage(LOGO_C, 0, 380);
      tctx.globalCompositeOperation = 'source-in';
      const sx = lerp(LOGO_BOX.x0 - 200, LOGO_BOX.x1 + 200, ease(sk));
      const gr = tctx.createLinearGradient(sx - 120, 380, sx + 120, 900);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, `rgba(255,255,255,${.85 * Math.sin(Math.PI * sk)})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      tctx.fillStyle = gr; tctx.fillRect(0, 0, W, H); tctx.globalCompositeOperation = 'source-over';
      g.save(); g.globalCompositeOperation = 'lighter'; g.drawImage(TMP, 0, 0); g.restore();
      // anamorphe Lichtkante
      g.save(); g.globalCompositeOperation = 'lighter';
      const fx = sx, fa = .5 * Math.sin(Math.PI * sk);
      const fl = g.createLinearGradient(fx - 520, 0, fx + 520, 0);
      fl.addColorStop(0, 'rgba(80,180,255,0)'); fl.addColorStop(.5, `rgba(170,225,255,${fa})`); fl.addColorStop(1, 'rgba(80,180,255,0)');
      g.fillStyle = fl; g.fillRect(fx - 520, 638, 1040, 3);
      g.globalAlpha = fa * .5; g.drawImage(SOFT, fx - 70, 570, 140, 140);
      g.restore();
    }
  }
  // Botschaft
  const sz = fitSize(g, 'Deine Fläche. Wie neu.', 700, 92, TEXT_MAX - 60);
  line(g, ['Deine', 'Fläche.', { text: 'Wie', grad: 1 }, { text: 'neu.', grad: 1 }], 1015, sz, 700, t, 24.15, null, { stagger: .11 });
  // Call-to-Action als Pill
  const ck = easeOutExpo((t - 25.55) / 1.0);
  if (ck > 0) {
    const txt = 'Jetzt Hochdruckreinigung anfragen.';
    const fs = fitSize(g, txt, 600, 38, TEXT_MAX - 130);
    setFont(g, fs, 600, -fs * .01); const tw = g.measureText(txt).width;
    const pw = tw + 84, ph = fs + 46, py = 1150 + (1 - ck) * 24;
    g.save(); g.globalAlpha = ck;
    const pg = g.createLinearGradient(CX - pw / 2, 0, CX + pw / 2, 0);
    pg.addColorStop(0, '#1aa6e6'); pg.addColorStop(1, '#2b6fff');
    g.shadowColor = 'rgba(40,150,255,.45)'; g.shadowBlur = 50 * ck;
    g.fillStyle = pg; g.beginPath(); g.roundRect(CX - pw / 2, py - ph / 2, pw, ph, ph / 2); g.fill();
    g.shadowBlur = 0;
    // Glanz wandert einmal über den Button
    const gk = (t - 26.1) / .9;
    if (gk > 0 && gk < 1) {
      g.save(); g.clip();
      const gx = lerp(CX - pw / 2 - 100, CX + pw / 2 + 100, ease(gk));
      const sh = g.createLinearGradient(gx - 80, 0, gx + 80, 0);
      sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(.5, 'rgba(255,255,255,.35)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = sh; g.fillRect(CX - pw / 2, py - ph / 2, pw, ph); g.restore();
    }
    g.fillStyle = '#fff'; setFont(g, fs, 600, -fs * .01); g.fillText(txt, CX - tw / 2, py + fs * .36);
    g.restore();
  }
  line(g, ['Unverbindlich', '&', 'fair.'], 1290, 34, 500, t, 26.55, null, { color: 'rgba(205,218,232,.82)', stagger: .07, track: .5 });
  line(g, ['Bordesholm', '·', 'Schleswig-Holstein'], 1350, 25, 500, t, 27.15, null, { color: 'rgba(140,156,175,.75)', stagger: .05, track: 2 });
}

// ── Komposition ─────────────────────────────────────────────────────────────
function render(t) {
  t = clamp(t, 0, DUR - 1e-4);
  const g = ctx;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  if (OVERLAY) { renderOverlay(g, t); g.restore(); return; }
  if (t < 4.0) scene1(g, t);
  else if (t < 16.0) scene23(g, t);
  else if (t < 22.0) scene4(g, t);
  else {
    scene5bg(g, t);
    if (t < 22.6) {                       // Ausblende der letzten Einstellung
      const k = sstep(22.0, 22.6, t);
      const c = BUF[0].getContext('2d'); shot(c, SHOTS[2], t);
      g.globalAlpha = 1 - k; g.drawImage(BUF[0], 0, 0); g.globalAlpha = 1;
    }
    scene5fg(g, t);
  }
  // Blende Szene 3 → 4
  if (t >= 16.0 && t < 16.6) { g.fillStyle = `rgba(200,232,250,${.55 * (1 - sstep(16.0, 16.6, t))})`; g.globalCompositeOperation = 'screen'; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'source-over'; }
  grain(g, t, t < 4 || t > 22 ? .035 : .06);
  if (showSafe) drawSafe(g);
  g.restore();
}
// Nur Typografie + Logo (Alpha), für eigenes Footage aus Higgsfield
function renderOverlay(g, t) {
  g.clearRect(0, 0, W, H);
  if (t < 4) {
    headline1(g, t);
  } else if (t >= 16 && t < 22.4) {
    const sz = fitSize(g, 'Pflasterflächen.', 700, 118, TEXT_MAX);
    for (const s of SHOTS) if (t >= s.t0 && t < s.t1) line(g, [s.word], 640, sz, 700, t, s.t0 + .35, s.t1 - .55, { dur: .8 });
  }
  if (t >= 22) scene5fg(g, t);
  if (showSafe) drawSafe(g);
}

// Safe Zones: TikTok + Instagram Reels (Vereinigung der UI-Flächen)
let showSafe = params.has('safe');
function drawSafe(g) {
  g.save();
  g.fillStyle = 'rgba(255,40,80,.22)';
  g.fillRect(0, 0, W, 220);              // Statusleiste, Tabs, „Folge ich / Für dich"
  g.fillRect(0, H - 480, W, 480);        // Profil, Caption, Musik, Kommentarfeld
  g.fillRect(W - 160, 700, 160, H - 1180); // Like / Kommentar / Teilen / Profil
  g.strokeStyle = 'rgba(80,255,160,.9)'; g.lineWidth = 3; g.setLineDash([14, 10]);
  g.strokeRect(CX - TEXT_MAX / 2, 220, TEXT_MAX, H - 700);
  g.restore();
}

// ── Start ───────────────────────────────────────────────────────────────────
const status = document.getElementById('status');
async function init() {
  await document.fonts.ready;
  await Promise.all(['300', '500', '600', '700'].map(w => document.fonts.load(`${w} 40px Inter`))).catch(() => {});
  await loadLogo();
  if (!OVERLAY) {
    await new Promise(r => setTimeout(r, 30));
    const A = noiseField(11, 5, 5, .55), B = noiseField(13, 7, 5, .55);
    for (let i = 0; i < NPX; i++) A[i] = (A[i] + B[i]) * .5 + (A[i] - .5) * .25;   // zwei Gitter → keine Rastermuster
    NF = [A, noiseField(23, 24, 4, .5), noiseField(37, 160, 3, .5)];
    TEX = {
      slabs: bakeTextures('slabs', ['dirty', 'wet']),
      herring: bakeTextures('herring', ['wet']),
      cobble: bakeTextures('cobble', ['wet']),
    };
    NF = null;
  }
  status.remove();
}
window.render = render;
window.DUR = DUR; window.FPS = FPS;
window.ready = init();

if (!EXPORT) {
  const play = document.getElementById('play'), seek = document.getElementById('seek'), time = document.getElementById('time');
  const music = document.getElementById('music');
  let playing = true, t0 = performance.now(), off = 0;
  const now = () => playing ? (off + (performance.now() - t0) / 1000) % DUR : off;
  const toggle = () => { off = now(); playing = !playing; t0 = performance.now(); play.textContent = playing ? 'Pause' : 'Play';
    if (playing) { music.currentTime = off; music.play().catch(() => {}); } else music.pause(); };
  play.onclick = toggle; canvas.onclick = toggle;
  document.getElementById('safe').onclick = () => { showSafe = !showSafe; };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.key === 's') showSafe = !showSafe; });
  seek.oninput = () => { off = +seek.value; t0 = performance.now(); music.currentTime = off; };
  window.ready.then(() => {
    t0 = performance.now(); music.play().catch(() => { playing = false; play.textContent = 'Play'; });
    let last = -1;
    const loop = () => {
      const t = now();
      if (playing && t < last) { music.currentTime = 0; music.play().catch(() => {}); }
      last = t; render(t); seek.value = t; time.textContent = t.toFixed(2);
      requestAnimationFrame(loop);
    };
    loop();
  });
}
</script>
