<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!--
      Terrassenreinigung – Social-Reel (TikTok / Reels), 1080×1920, 30 fps, 36,2 s, mit Voiceover.
      Szenen (Sekunden):
        intro    0.0 – 6.4   Selfie-Hook „Diese Terrasse war fällig“ → Flecken → Werkzeug
        fegen    6.1 – 9.7   Schritt 1: Abfegen (2× Tempo)
        flaeche  9.4 – 16.6  Schritt 2: Flächenreiniger
        strahl  16.3 – 21.0  Schritt 3: Hochdruck-Detail (Zeitlupe + Punch-ins)
        spuelen 20.7 – 26.5  Schritt 4: Abspülen (2× Tempo)
        reveal  26.2 – 36.2  Vorher/Nachher-Slider + Endkarte, auf den Voiceover getimt
      Jede Szene startet 0,3 s vor dem Ende der vorigen und schiebt sich als vertikaler Whip darüber.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36.2"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <div id="ground"></div>

      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="6.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <div id="fegen" data-composition-id="fegen" data-composition-src="compositions/fegen.html"
        data-start="6.1" data-duration="3.6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <div id="flaeche" data-composition-id="flaeche" data-composition-src="compositions/flaeche.html"
        data-start="9.4" data-duration="7.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <div id="strahl" data-composition-id="strahl" data-composition-src="compositions/strahl.html"
        data-start="16.3" data-duration="4.7" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>

      <div id="spuelen" data-composition-id="spuelen" data-composition-src="compositions/spuelen.html"
        data-start="20.7" data-duration="5.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="26.2" data-duration="10" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- Voiceover: Sätze aus assets/audio/voiceover.wav (vo-01/02 aus voiceover-intro.wav, neu aufgenommen), einzeln auf die Szenen gelegt -->
      <audio id="vo-01" class="clip" src="assets/audio/voiceover-intro.wav" data-start="0.15" data-duration="2.74" data-media-start="0.87" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Intro Satz 1 (neu aufgenommen)"></audio>
      <audio id="vo-02" class="clip" src="assets/audio/voiceover-intro.wav" data-start="2.92" data-duration="1.79" data-media-start="4.51" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Intro Satz 2 (neu aufgenommen)"></audio>
      <audio id="vo-03" class="clip" src="assets/audio/voiceover.wav" data-start="4.76" data-duration="1.71" data-media-start="6.76" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Das ist heute mein Werkzeug."></audio>
      <audio id="vo-04" class="clip" src="assets/audio/voiceover.wav" data-start="6.55" data-duration="3.14" data-media-start="9.04" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Erster Schritt, alles einmal grob abfegen."></audio>
      <audio id="vo-05" class="clip" src="assets/audio/voiceover.wav" data-start="9.75" data-duration="4.00" data-media-start="13.36" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Dann kommt der Flächenreiniger drauf, Bahn für Bahn über die ganze Fläche."></audio>
      <audio id="vo-06" class="clip" src="assets/audio/voiceover.wav" data-start="13.85" data-duration="2.53" data-media-start="17.62" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Der löst den Dreck schön gleichmäßig."></audio>
      <audio id="vo-07" class="clip" src="assets/audio/voiceover.wav" data-start="16.55" data-duration="3.22" data-media-start="21.08" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Hartnäckige Stellen nehme ich mir mit dem Strahl einzeln vor."></audio>
      <audio id="vo-08" class="clip" src="assets/audio/voiceover.wav" data-start="20.95" data-duration="4.14" data-media-start="25.24" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Zum Schluss alles gründlich abspülen, bis der ganze Dreck runter ist."></audio>
      <audio id="vo-09" class="clip" src="assets/audio/voiceover.wav" data-start="26.5" data-duration="1.48" data-media-start="30.24" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Und jetzt der Vergleich."></audio>
      <audio id="vo-10" class="clip" src="assets/audio/voiceover.wav" data-start="28.1" data-duration="0.87" data-media-start="32.28" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Vorher …"></audio>
      <audio id="vo-11" class="clip" src="assets/audio/voiceover.wav" data-start="29.2" data-duration="0.98" data-media-start="33.47" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="… und nachher."></audio>
      <audio id="vo-12" class="clip" src="assets/audio/voiceover.wav" data-start="30.5" data-duration="0.79" data-media-start="35.24" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Krass, oder?"></audio>
      <audio id="vo-13" class="clip" src="assets/audio/voiceover.wav" data-start="32.8" data-duration="0.76" data-media-start="37.26" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Wie neu."></audio>
      <audio id="vo-14" class="clip" src="assets/audio/voiceover.wav" data-start="33.65" data-duration="2.14" data-media-start="38.06" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="9" title="Deine Terrasse auch? Schreib uns."></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
