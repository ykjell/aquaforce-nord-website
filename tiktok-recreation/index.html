<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Limits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=block" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#ddd; --muted:#777; --btn:#1c1c1e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px Inter,system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px 16px; }
  canvas { height:calc(100vh - 70px); max-width:100%; aspect-ratio:9/16; background:#010001; border-radius:12px; display:block; cursor:pointer; }
  .bar { display:flex; gap:10px; align-items:center; width:min(100%, 420px); }
  .bar button { background:var(--btn); color:#fff; border:0; border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  .bar input { flex:1; accent-color:#ff784e; }
  .bar span { font-variant-numeric:tabular-nums; color:var(--muted); width:44px; text-align:right; }
  body.export { padding:0; display:block; }
  body.export .bar { display:none; }
  body.export canvas { height:auto; width:1080px; border-radius:0; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">Pause</button>
  <input id="seek" type="range" min="0" max="11.9" step="0.01" value="0">
  <span id="time">0.00</span>
</div>
<script>
// ─────────────────────────────────────────────────────────────────────
//  Nachbau des TikTok-Edits „Know your limits."
//  iMessage-Chat (6 Zoom-Schnitte) → Claude-Wortmarke → Cockpit → Montage
//
//  Alle Maße, Farben und Schnittzeiten sind aus dem Original-Video
//  gemessen (Bildschirmaufnahme 1170×2532, 60 fps):
//   • Ausgabe 1080×1920; Original-Pixel → Canvas: Faktor 1080/1170,
//     Mitte des TikTok-Players (y 1140.5) → Canvas-Mitte (y 960)
//   • Montage-Clips liegen in einem Band 1080×1120 (Original y 534–1747)
//   • Loop-Länge 11,9 s; t = 0 entspricht Original-Sekunde 0,3
//  render(t) ist deterministisch → MP4-Export mit render.mjs
// ─────────────────────────────────────────────────────────────────────
const W = 1080, H = 1920;
const K = 1080 / 1170;                 // Original-Pixel → Canvas
const OY = 960 - 1140.5 * K;           // vertikaler Versatz
const BY = Math.round((534 - 1140.5) * K + 960);   // 400
const BH = 1120;                       // Band (lokale Koordinaten 0..1120)
const LOOP = 11.9;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  black: '#010001', grey: '#232029', blue: '#0a7afe', meta: '#8b8891',
  orange: '#ff784e', ink: '#130810', navy: '#12131b',
};
const F = {
  ui: 'Inter, -apple-system, "Helvetica Neue", sans-serif',
  mono: '"JetBrains Mono", "DejaVu Sans Mono", monospace',
  serif: '"Source Serif 4", Georgia, serif',
};

// ── Helpers ──────────────────────────────────────────────────────────
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, font, color, align = 'left', base = 'alphabetic') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y); }
function mono(px, w = 400) { return `${w} ${px}px ${F.mono}`; }
function line(x1, y1, x2, y2, color, w = 1) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, fill) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
// Logo-Band (Original y 534–1747): lokales Koordinatensystem 0..1080 × 0..1120
function band(bg) {
  ctx.beginPath(); ctx.rect(0, BY, W, BH); ctx.clip();
  ctx.translate(0, BY);
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, W, BH); }
}
// Montage-Clips sind höher (Original y 499–1783): gleiches Koordinatensystem,
// sichtbar von y −32 bis 1154
const MY0 = Math.round((499 - 534) * K), MY1 = Math.round((1783 - 534) * K);   // −32 / 1153
function mband(bg) {
  ctx.beginPath(); ctx.rect(0, BY + MY0, W, MY1 - MY0); ctx.clip();
  ctx.translate(0, BY);
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, MY0, W, MY1 - MY0); }
}
const fitCache = {};
function fitSize(str, family, weight, width) {   // Schriftgröße, bei der str genau width breit ist
  const key = [str, family, weight, width].join('|');
  if (fitCache[key]) return fitCache[key];
  ctx.save(); ctx.font = `${weight} 100px ${family}`; const w = ctx.measureText(str).width; ctx.restore();
  return (fitCache[key] = 100 * width / w);
}

// ═════════════════════════════════════════════════════════════════════
//  1  iMessage-Chat – Koordinaten in Original-Pixeln (Zoomstufe 1)
// ═════════════════════════════════════════════════════════════════════
// Zoomstufen [Skalierung, tx, ty] – aus Blasenkanten im Video berechnet
const CHAT_KEYS = [
  [1.000, 0, 0],
  [1.294, 21, -337],
  [2.135, 22, -1298],
  [1.194, -239, -222],
  [1.718, -883, -1075],
  [2.476, -1624, -2079],
];
// Blasen: Körper 124 px hoch, Text 41 px eingerückt, Grundlinie +83
const BUBBLES = [
  { s: 'Do you love me?',   side: 'l', x0: -44, x1: 492,  top: 820 },
  { s: 'Yeah',              side: 'r', x0: 966, x1: 1173, top: 990 },
  { s: 'More than Claude?', side: 'l', x0: -44, x1: 564,  top: 1160 },
  { s: 'Know your limits.', side: 'r', x0: 622, x1: 1173, top: 1330 },
];
const BUB_H = 124;
function bubble(b) {
  const { x0, x1, top, side } = b, bot = top + BUB_H;
  ctx.fillStyle = side === 'l' ? C.grey : C.blue;
  rr(x0, top, x1 - x0, BUB_H, 60); ctx.fill();
  ctx.beginPath();                                   // iMessage-Schwänzchen
  if (side === 'r') {
    ctx.moveTo(x1 - 44, bot - 4);
    ctx.lineTo(x1 - 30, bot - 60);
    ctx.lineTo(x1 - 3, bot - 60);
    ctx.quadraticCurveTo(x1 - 1, bot - 8, x1 + 16, bot + 10);
    ctx.quadraticCurveTo(x1 - 20, bot + 12, x1 - 44, bot - 4);
  } else {
    ctx.moveTo(x0 + 44, bot - 4);
    ctx.lineTo(x0 + 30, bot - 60);
    ctx.lineTo(x0 + 3, bot - 60);
    ctx.quadraticCurveTo(x0 + 1, bot - 8, x0 - 16, bot + 10);
    ctx.quadraticCurveTo(x0 + 20, bot + 12, x0 + 44, bot - 4);
  }
  ctx.closePath(); ctx.fill();
  const size = fitSize('Know your limits.', F.ui, 500, 462);   // gemessene Textbreite
  text(b.s, x0 + 41, top + 83, `500 ${size}px ${F.ui}`, '#fff');
}
function meta(bold, rest, x, base, width, align) {
  const size = fitSize(bold + rest, F.ui, 600, width);
  ctx.font = `700 ${size}px ${F.ui}`; const bw = ctx.measureText(bold).width;
  ctx.font = `500 ${size}px ${F.ui}`; const rw = ctx.measureText(rest).width;
  const sx = align === 'center' ? x - (bw + rw) / 2 : x - (bw + rw);
  text(bold, sx, base, `700 ${size}px ${F.ui}`, C.meta);
  text(rest, sx + bw, base, `500 ${size}px ${F.ui}`, C.meta);
}
function sceneChat(u, key) {
  ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H);
  const [s, tx, ty] = CHAT_KEYS[key];
  ctx.setTransform(K, 0, 0, K, 0, OY);
  ctx.transform(s, 0, 0, s, tx, ty);
  meta('Today', ' 5:54 PM', 566, 776, 305, 'center');
  BUBBLES.forEach(bubble);
  meta('Read', ' 5:55 PM', 1121, 1528, 291, 'right');
}

// ═════════════════════════════════════════════════════════════════════
//  Claude-Wortmarke  (Band-Koordinaten: Funke x 349, Text x 414–745)
// ═════════════════════════════════════════════════════════════════════
const SPARK = (() => { const r = rng(7), a = []; for (let i = 0; i < 14; i++) a.push({ ang: i / 14 * Math.PI * 2 + (r() - .5) * .2, len: .74 + r() * .26, w: .8 + r() * .4 }); return a; })();
function spark(x, y, R, rot = 0, color = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  for (const s of SPARK) {
    ctx.save(); ctx.rotate(s.ang);
    const L = R * s.len, w0 = R * .155 * s.w, w1 = R * .07 * s.w;
    ctx.beginPath();
    ctx.moveTo(0, -w0); ctx.lineTo(L, -w1); ctx.arc(L, 0, w1, -Math.PI / 2, Math.PI / 2); ctx.lineTo(0, w0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, R * .17, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
const WM = { sx: 349, tx: 414, tw: 331, cy: 560, R: 48 };
function wordText(letters, color) {
  const size = fitSize('Claude', F.serif, 600, WM.tw);
  text('Claude'.slice(0, letters), WM.tx, WM.cy + size * .03, `600 ${size}px ${F.serif}`, color, 'left', 'middle');
}
function wordmark(color = '#fff', sparkColor = '#fff', rot = 0) {
  spark(WM.sx, WM.cy, WM.R, rot, sparkColor);
  wordText(6, color);
}

// ═════════════════════════════════════════════════════════════════════
//  2  Orange: Funke erscheint, wächst, wandert, Text tippt sich
// ═════════════════════════════════════════════════════════════════════
// Messpunkte [u, x, r] aus dem Video (60 fps)
const SPARK_KEYS = [[0, 525, 25], [.05, 523, 36], [.15, 522, 47], [.33, 525, 48], [.42, 507, 61], [.5, 434, 63], [.56, 378, 63], [.66, 344, 52], [.78, 349, 48]];
function sparkAt(u) {
  for (let i = 1; i < SPARK_KEYS.length; i++) {
    const [u0, x0, r0] = SPARK_KEYS[i - 1], [u1, x1, r1] = SPARK_KEYS[i];
    if (u < u1) { const k = easeInOut((u - u0) / (u1 - u0)); return [lerp(x0, x1, k), lerp(r0, r1, k)]; }
  }
  return [WM.sx, WM.R];
}
function sceneOrange(u) {
  band(C.orange);
  const [x, r] = sparkAt(u);
  spark(x, WM.cy, r, u * .9);
  const letters = u < .55 ? 0 : u < .617 ? 1 : u < .733 ? 4 : 6;          // gemessene Stufen: C → Clau → Claude
  if (letters) wordText(letters, C.ink);
}

// ═════════════════════════════════════════════════════════════════════
//  3  Navy mit Atmosphären-Schimmer am unteren Rand
// ═════════════════════════════════════════════════════════════════════
function sceneNavy(u) {
  band(C.navy);
  const g = ctx.createLinearGradient(0, 860, 0, BH);
  g.addColorStop(0, 'rgba(18,19,27,0)'); g.addColorStop(.45, 'rgba(22,42,64,.85)'); g.addColorStop(1, 'rgba(48,96,136,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 860, W, BH - 860);
  const v = ctx.createRadialGradient(540, 1400, 300, 540, 1400, 700);
  v.addColorStop(0, 'rgba(70,130,180,.35)'); v.addColorStop(1, 'rgba(70,130,180,0)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, BH);
  const r = rng(13); ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = 0; i < 25; i++) ctx.fillRect(r() * W, r() * 700, 1.5, 1.5);
  wordmark('#fff', '#fff', .7 + u * .1);
}

// ═════════════════════════════════════════════════════════════════════
//  4  Cockpit-Fenster mit Erde – 2 Frames nah, dann Sprung in die Totale
// ═════════════════════════════════════════════════════════════════════
function cockpitWorld() {
  ctx.fillStyle = '#000'; ctx.fillRect(-2000, -2000, 5000, 5000);
  ctx.fillStyle = '#0b0b0f'; ctx.fillRect(-200, 300, 1480, 600);            // Innenraum
  const r = rng(11);
  // Fensterausschnitt mit Erde
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(130, 411); ctx.lineTo(972, 425); ctx.lineTo(778, 782); ctx.quadraticCurveTo(520, 800, 262, 770); ctx.closePath();
  ctx.clip();
  ctx.fillStyle = '#020306'; ctx.fillRect(0, 380, W, 420);
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (let i = 0; i < 40; i++) ctx.fillRect(140 + r() * 820, 420 + r() * 120, 1.3, 1.3);
  const ex = 560, ey = 573 + 1400, er = 1400;
  const g = ctx.createRadialGradient(ex, ey, er * .86, ex, ey, er);
  g.addColorStop(0, '#03102a'); g.addColorStop(.75, '#0a3a8c'); g.addColorStop(.97, '#2e7fe0'); g.addColorStop(1, '#8fd0ff');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = '#7cc4ff'; ctx.shadowBlur = 24; ctx.strokeStyle = 'rgba(150,215,255,.85)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(ex, ey, er + 1, Math.PI * 1.32, Math.PI * 1.68); ctx.stroke();
  ctx.restore();
  // Rahmen und Streben
  line(110, 400, 985, 415, '#3c3f48', 5);
  line(70, 520, 220, 800, 'rgba(150,155,170,.6)', 4);
  line(130, 411, 262, 770, '#2c2e35', 8);
  ctx.save(); ctx.shadowColor = '#cfe4ff'; ctx.shadowBlur = 10;
  line(975, 455, 800, 822, 'rgba(225,235,250,.95)', 4);
  line(1000, 430, 840, 830, 'rgba(160,180,210,.5)', 2);
  ctx.restore();
  line(262, 772, 778, 784, '#2a2c33', 6);
  // Konsole
  ctx.fillStyle = '#121318'; ctx.fillRect(-200, 790, 1480, 106);
  const r2 = rng(12);
  for (let i = 0; i < 70; i++) {
    ctx.fillStyle = `rgba(${120 + r2() * 80},${125 + r2() * 80},${140 + r2() * 80},${.25 + r2() * .35})`;
    ctx.fillRect(r2() * 1080, 800 + r2() * 90, 6 + r2() * 26, 3 + r2() * 8);
  }
  ctx.save(); ctx.fillStyle = '#ff6a1f'; ctx.shadowColor = '#ff6a1f'; ctx.shadowBlur = 16;
  ctx.fillRect(524, 728, 22, 38); ctx.restore();
  ctx.fillStyle = '#3a1a08'; ctx.fillRect(530, 736, 10, 8);
}
function sceneCockpit(u) {
  band('#000');
  const close = u < .05;                       // 2 Frames Nahaufnahme, dann Sprung
  ctx.save();
  if (close) { ctx.translate(540, 500); ctx.scale(1.6, 1.6); ctx.translate(-540, -500); }
  cockpitWorld();
  ctx.restore();
  const s = close ? 1 : .61;
  ctx.save(); ctx.translate(545, 557); ctx.scale(s, s); ctx.translate(-545, -560);
  wordmark('#fff', '#fff', .8);
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════════════
//  5  Verdrillter Draht-Torus mit HUD
// ═════════════════════════════════════════════════════════════════════
function sceneTorus(u) {
  mband('#060c16');
  const t = u;
  const hud = 'rgba(150,170,195,.65)';
  [['ACT RATIO', '.239'], ['APERTURE / MM', '96.0'], ['TWIST / DEG', '63.0'], ['STRAIN / %', '18.3'], ['MODE ENTROPY', '2.056'], ['RESOLVE / HZ', '13.9']]
    .forEach(([a, b], i) => { text(a, 10 + i * 150, 14, mono(11), hud); text(b, 10 + i * 150, 36, mono(17), 'rgba(220,230,240,.85)'); });
  const cx = 431, cy = 555, f = 900;
  const rx = .8 + Math.sin(t * 2.4) * .06, ry = -.12 + t * .35, rz = -.12 + t * .5;
  const proj = (x, y, z) => {
    const x0 = x * Math.cos(rz) - y * Math.sin(rz), y0 = x * Math.sin(rz) + y * Math.cos(rz);
    const y1 = y0 * Math.cos(rx) - z * Math.sin(rx), z1 = y0 * Math.sin(rx) + z * Math.cos(rx);
    const x2 = x0 * Math.cos(ry) + z1 * Math.sin(ry), z2 = -x0 * Math.sin(ry) + z1 * Math.cos(ry);
    const p = f / (f + z2 + 300); return [cx + x2 * p * 1.32, cy + y1 * p * 1.32];
  };
  const N = 130, M = 56;
  const pt = (i, j) => {
    const th = i / N * Math.PI * 2, ph = j / M * Math.PI * 2 + th * 3;
    const R = 290 + 22 * Math.sin(2 * th + .6), rt = 70 + 16 * Math.sin(3 * th + 1);
    return proj((R + rt * Math.cos(ph)) * Math.cos(th), (R + rt * Math.cos(ph)) * Math.sin(th), rt * Math.sin(ph));
  };
  ctx.lineWidth = 1;
  for (let j = 0; j < M; j++) {
    ctx.strokeStyle = j % 7 === 0 ? 'rgba(240,175,70,.6)' : j % 7 === 3 ? 'rgba(170,230,240,.45)' : 'rgba(70,195,210,.32)';
    ctx.beginPath();
    for (let i = 0; i <= N; i++) { const [x, y] = pt(i, j); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(110,215,225,.16)';
  for (let i = 0; i < N; i += 2) {
    ctx.beginPath();
    for (let j = 0; j <= M; j++) { const [x, y] = pt(i, j); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  // rechte HUD-Spalte
  line(886, 70, 886, 1000, 'rgba(120,150,180,.35)');
  ctx.strokeStyle = 'rgba(120,150,180,.35)'; ctx.lineWidth = 1; ctx.strokeRect(900, 110, 170, 170);
  text('A / CURVATURE', 908, 100, mono(11), hud);
  ctx.strokeStyle = 'rgba(200,225,245,.85)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let a = 0; a <= 90; a++) { const th = a / 90 * Math.PI * 2, rad = 34 + 22 * Math.cos(3 * th + t * 2); const x = 985 + rad * Math.cos(th), y = 195 + rad * Math.sin(th); a ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath(); ctx.stroke();
  text('CURV MAX 2.469', 908, 310, mono(11), hud);
  text('B / TORSION', 908, 380, mono(11), hud);
  text('LOCAL DEFORMATION TENSOR', 908, 425, mono(10), hud);
  const r = rng(4);
  for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {
    const on = r() > .25; ctx.fillStyle = on ? 'rgba(225,140,35,.9)' : 'rgba(70,85,105,.7)';
    ctx.fillRect(908 + col * 56, 440 + row * 34, 50, 26);
    text((r() > .5 ? '+' : '-') + (r()).toFixed(2), 912 + col * 56, 458 + row * 34, mono(10), on ? '#1a0e00' : '#aab');
  }
  text('C / LAYER', 908, 585, mono(11), hud);
  text('SEPARATION 14.74 MM', 908, 705, mono(10), hud);
  ctx.fillStyle = 'rgba(200,210,225,.5)';
  for (let i = 0; i < 40; i++) ctx.fillRect(908 + (i % 10) * 16, 730 + Math.floor(i / 10) * 16, 3, 3);
  text('DISPLACEMENT FIELD / XY', 908, 900, mono(10), hud);
  // untere Panels
  line(0, 1012, W, 1012, 'rgba(120,150,180,.35)');
  text('APE SPACE / PRINCIPAL MODES', 6, 1036, mono(11), hud);
  text('LAYER SEPARATION / HISTORY', 360, 1036, mono(11), hud);
  text('TRANSFORMATION SEQUENCE', 730, 1036, mono(11), hud);
  ctx.strokeStyle = 'rgba(200,220,240,.6)'; ctx.lineWidth = 1;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); for (let a = 0; a <= 60; a++) { const th = a / 60 * Math.PI * 2; const x = 130 + 110 * Math.cos(th + k), y = 1085 + 26 * Math.sin(2 * th + k + t * 3); a ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  for (let k = 0; k < 6; k++) { ctx.beginPath(); for (let x = 0; x < 300; x += 4) { const y = 1056 + k * 11 + Math.sin(x / 18 + k * .7 + t * 4) * 4; x ? ctx.lineTo(360 + x, y) : ctx.moveTo(360 + x, y); } ctx.stroke(); }
  [['001 SPLIT', 'MO3', '+0.338', 'VALID'], ['002 TWIST', 'MO2', '+0.326', 'VALID'], ['003 STRETCH', 'MO1', '+0.214', 'VALID']]
    .forEach((row, i) => row.forEach((c, j) => text(c, 730 + [0, 130, 200, 300][j], 1062 + i * 18, mono(10), 'rgba(200,210,220,.65)')));
}

// ═════════════════════════════════════════════════════════════════════
//  6  Code – schnelles Scrollen mit Bewegungsunschärfe
// ═════════════════════════════════════════════════════════════════════
const CODE_TOP = [
  '\\n\\n--- Performance Metrics ---")',
  '"Prompt: {prompt_tokens} tokens, {prompt_tps:.3f} tokens-per-sec")',
  '"Generation: {generated_tokens} tokens, {generation_tps:.3f} tokens-per-sec")',
  '"Total time: {total_time:.2f} seconds")',
  '"Full response length: {len(full_response)} characters")',
];
const CODE = `.nav-links a {
    color: var(--dark);
    font-weight: 500;
    transition: color 0.3s;
}

.nav-links a:hover {

const BRAIN = (() => {
  const r = rng(81), pts = [];
  for (let i = 0; i < 36000; i++) {
    const th = r() * Math.PI * 2, ph = Math.acos(2 * r() - 1);
    const x = Math.sin(ph) * Math.cos(th), y = Math.cos(ph), z = Math.sin(ph) * Math.sin(th);
    const fold = 1 + .05 * Math.sin(th * 11 + ph * 9) + .035 * Math.sin(ph * 17 + th * 3);
    const rad = (.55 + Math.cbrt(r()) * .45) * fold;
    const px = x * 1.38 * rad, py = y * (y > 0 ? 1 : .72) * rad, pz = z * 1.05 * rad;
    if (py < -.45 && px < -.35) continue;                         // Aussparung für das Kleinhirn
    pts.push([px, py, pz, r()]);
  }
  for (let i = 0; i < 4500; i++) {                                // Kleinhirn
    const th = r() * Math.PI * 2, ph = Math.acos(2 * r() - 1);
    pts.push([-.95 + Math.sin(ph) * Math.cos(th) * .38, -.62 + Math.cos(ph) * .26, Math.sin(ph) * Math.sin(th) * .55, r()]);
  }
  return pts;
