<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Limits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,500&display=block" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#ddd; --muted:#777; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px Inter,system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px 16px; }
  canvas { height:calc(100vh - 70px); max-width:100%; aspect-ratio:9/16; background:#010001; border-radius:12px; display:block; cursor:pointer; }
  .bar { display:flex; gap:10px; align-items:center; width:min(100%, 420px); }
  .bar button { background:#1c1c1e; color:#fff; border:0; border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  .bar input { flex:1; accent-color:#ff784e; }
  .bar span { font-variant-numeric:tabular-nums; color:var(--muted); width:44px; text-align:right; }
  body.export { padding:0; display:block; }
  body.export .bar { display:none; }
  body.export canvas { height:auto; width:1080px; border-radius:0; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">Pause</button>
  <input id="seek" type="range" min="0" max="12" step="0.01" value="0">
  <span id="time">0.00</span>
</div>
<script>
// ─────────────────────────────────────────────────────────────
//  Nachbau des TikTok-Edits: iMessage-Chat → Claude-Logo → Montage
//  12-Sekunden-Loop, Schnitte im 0,5-s-Takt (120 BPM).
//  render(t) ist deterministisch → MP4-Export via render.mjs
// ─────────────────────────────────────────────────────────────
const W = 1080, H = 1920;
const BY = 380, BH = 960, BCY = BY + BH / 2;        // "Band" der Montage-Clips
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const LOOP = 12;

const C = {
  black: '#010001', grey: '#232029', blue: '#0a7afe', meta: '#8d8a93',
  orange: '#ff784e', navy: '#12131b',
};
const F = {
  ui: 'Inter, -apple-system, "Helvetica Neue", sans-serif',
  mono: '"JetBrains Mono", "DejaVu Sans Mono", monospace',
  serif: '"Source Serif 4", Georgia, serif',
};

// ── Helpers ──────────────────────────────────────────────────
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, font, color, align = 'left', base = 'alphabetic') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y); }
function band(bg) { ctx.beginPath(); ctx.rect(0, BY, W, BH); ctx.clip(); if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, BY, W, BH); } }
function mono(px, w = 400) { return `${w} ${px}px ${F.mono}`; }

// ── Szene 1: iMessage-Chat mit harten Zoom-Schnitten ─────────
// [scale, tx, ty] – aus dem Original-Video abgemessen
const CHAT_KEYS = [
  [1.00, 0, 0],
  [1.311, -6, -270],
  [2.14, -45, -989],
  [1.19, -238, -167],
  [1.68, -748, -774],
  [2.46, -1429, -1553],
];
function bubble(x, cy, str, side) {
  ctx.font = `400 52px ${F.ui}`;
  const tw = ctx.measureText(str).width, w = tw + 62, h = 94;
  const L = side === 'l' ? x : x - w, T = cy - h / 2, B = cy + h / 2;
  ctx.fillStyle = side === 'l' ? C.grey : C.blue;
  rr(L, T, w, h, 47); ctx.fill();
  // iMessage-"Schwänzchen"
  ctx.beginPath();
  if (side === 'l') {
    ctx.moveTo(L + 12, B - 34);
    ctx.quadraticCurveTo(L + 10, B - 4, L - 12, B + 1);
    ctx.quadraticCurveTo(L + 18, B + 6, L + 40, B - 8);
  } else {
    const R = L + w;
    ctx.moveTo(R - 12, B - 34);
    ctx.quadraticCurveTo(R - 10, B - 4, R + 12, B + 1);
    ctx.quadraticCurveTo(R - 18, B + 6, R - 40, B - 8);
  }
  ctx.closePath(); ctx.fill();
  text(str, L + 31, cy + 2, `400 52px ${F.ui}`, '#fff', 'left', 'middle');
}
function meta(boldPart, rest, x, y, size, align) {
  ctx.font = `600 ${size}px ${F.ui}`; const bw = ctx.measureText(boldPart).width;
  ctx.font = `400 ${size}px ${F.ui}`; const rw = ctx.measureText(rest).width;
  const total = bw + rw;
  const sx = align === 'center' ? x - total / 2 : x - total;
  text(boldPart, sx, y, `600 ${size}px ${F.ui}`, C.meta, 'left', 'middle');
  text(rest, sx + bw, y, `400 ${size}px ${F.ui}`, C.meta, 'left', 'middle');
}
function sceneChat(u, key) {
  ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H);
  const [s, tx, ty] = CHAT_KEYS[key];
  ctx.save();
  ctx.transform(s, 0, 0, s, tx, ty);
  meta('Today', ' 5:54 PM', 540, 500, 34, 'center');
  bubble(2, 669, 'Do you love me?', 'l');
  bubble(1068, 793, 'Yeah', 'r');
  bubble(2, 926, 'More than Claude?', 'l');
  bubble(1068, 1055, 'Know your limits.', 'r');
  meta('Read', ' 5:55 PM', 1048, 1144, 36, 'right');
  ctx.restore();
}

// ── Claude-Wortmarke ─────────────────────────────────────────
const SPARK = (() => { const r = rng(7), a = []; for (let i = 0; i < 12; i++) a.push({ ang: i / 12 * Math.PI * 2 + (r() - .5) * .18, len: .72 + r() * .28 }); return a; })();
function spark(x, y, R, rot = 0, color = '#fff') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  for (const s of SPARK) {
    ctx.save(); ctx.rotate(s.ang);
    const L = R * s.len, w0 = R * .13, w1 = R * .05;
    ctx.beginPath();
    ctx.moveTo(0, -w0); ctx.lineTo(L, -w1); ctx.arc(L, 0, w1, -Math.PI / 2, Math.PI / 2); ctx.lineTo(0, w0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, R * .16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
const WM = { R: 46, gap: 14, size: 128 };
function wordmarkLayout(cx) {
  ctx.font = `500 ${WM.size}px ${F.serif}`;
  const tw = ctx.measureText('Claude').width;
  const total = WM.R * 2 + WM.gap + tw;
  const left = cx - total / 2;
  return { sx: left + WM.R, tx: left + WM.R * 2 + WM.gap, tw };
}
function wordmark(cx, cy, reveal = 1, sparkX = null, rot = 0, color = '#fff') {
  const l = wordmarkLayout(cx);
  spark(sparkX ?? l.sx, cy, WM.R, rot, color);
  if (reveal <= 0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(l.tx - 4, cy - 150, (l.tw + 10) * reveal, 300); ctx.clip();
  text('Claude', l.tx, cy + 4, `500 ${WM.size}px ${F.serif}`, color, 'left', 'middle');
  ctx.restore();
}

// ── Szene 2: Orange → Funke → Wortmarke ──────────────────────
function sceneOrange(u) {
  band(C.orange);
  const l = wordmarkLayout(540);
  if (u < 0.45) {
    spark(540, BCY, 20 + Math.sin(u * 30) * 1.2, u * .6);
  } else if (u < 0.62) {
    const k = easeOut((u - .45) / .17);
    spark(540, BCY, lerp(20, WM.R * 1.15, k), .27 + k * .9);
  } else {
    const k = easeOut((u - .62) / .22);
    spark(lerp(540, l.sx, k), BCY, lerp(WM.R * 1.15, WM.R, k), 1.17 + k * .5);
    const rv = easeInOut((u - .66) / .2);
    if (rv > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(l.tx - 4, BCY - 150, (l.tw + 10) * rv, 300); ctx.clip();
      text('Claude', l.tx, BCY + 4, `500 ${WM.size}px ${F.serif}`, '#fff', 'left', 'middle');
      ctx.restore();
    }
  }
}

// ── Szene 3: Navy + Horizont-Schimmer ────────────────────────
function horizon(alpha = 1) {
  const g = ctx.createRadialGradient(540, BY + BH + 520, 300, 540, BY + BH + 520, 900);
  g.addColorStop(0, `rgba(70,140,200,${.9 * alpha})`);
  g.addColorStop(.6, `rgba(30,80,120,${.55 * alpha})`);
  g.addColorStop(1, 'rgba(18,19,27,0)');
  ctx.fillStyle = g; ctx.fillRect(0, BY, W, BH);
}
function sceneNavy(u) {
  band(C.navy);
  horizon(.75 + u * .3);
  wordmark(540, BCY, 1, null, 1.67 + u * .2);
}

// ── Szene 4: Cockpit-Fenster, Erde, Zoom-Out ─────────────────
function sceneCockpit(u) {
  band('#010103');
  const z = lerp(1.75, 1.0, easeOut(u / .45));
  ctx.save();
  ctx.translate(540, BCY); ctx.scale(z, z); ctx.translate(-540, -BCY);
  // Sterne
  const r = rng(11); ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 90; i++) ctx.fillRect(r() * W, BY + r() * 500, 1.5, 1.5);
  // Erde
  const ex = 560, ey = BCY + 1650, er = 1520;
  const g = ctx.createRadialGradient(ex, ey, er * .9, ex, ey, er);
  g.addColorStop(0, '#04122e'); g.addColorStop(.9, '#0b3d8f'); g.addColorStop(1, '#5fb4ff');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.shadowColor = '#6ec0ff'; ctx.shadowBlur = 40; ctx.strokeStyle = 'rgba(140,210,255,.9)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(ex, ey, er + 2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); ctx.restore();
  wordmark(540, BCY - 110, 1, null, 1.9);
  // Fensterrahmen (evenodd)
  ctx.beginPath();
  ctx.rect(-400, BY - 400, W + 800, BH + 800);
  ctx.moveTo(150, BY + 210);
  ctx.quadraticCurveTo(540, BY + 120, 930, BY + 210);
  ctx.quadraticCurveTo(1040, BY + 230, 1010, BY + 420);
  ctx.lineTo(940, BY + 700);
  ctx.quadraticCurveTo(540, BY + 760, 140, BY + 700);
  ctx.lineTo(70, BY + 420);
  ctx.quadraticCurveTo(40, BY + 230, 150, BY + 210);
  ctx.fillStyle = '#0d0e12'; ctx.fill('evenodd');
  ctx.strokeStyle = '#3b3e48'; ctx.lineWidth = 6; ctx.stroke();
  // Strebe rechts mit Lichtreflex
  ctx.strokeStyle = 'rgba(200,215,240,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(1000, BY + 260); ctx.quadraticCurveTo(960, BY + 520, 880, BY + 720); ctx.stroke();
  // Instrumententafel
  const r2 = rng(12);
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = `rgba(${90 + r2() * 60},${95 + r2() * 60},${110 + r2() * 60},.35)`;
    ctx.fillRect(40 + r2() * 1000, BY + 760 + r2() * 160, 20 + r2() * 60, 6 + r2() * 14);
  }
  ctx.fillStyle = '#ff6a2a'; ctx.shadowColor = '#ff6a2a'; ctx.shadowBlur = 20;
  ctx.fillRect(560, BY + 690, 14, 26); ctx.shadowBlur = 0;
  ctx.restore();
}

// ── Szene 5: verdrillter Draht-Torus + HUD ───────────────────
function hudLabels(seed, color = 'rgba(160,180,200,.6)', y = BY + 14) {
  const r = rng(seed);
  for (let i = 0; i < 7; i++) {
    text(['ACT RATIO', 'APERTURE / MM', 'TWIST / DEG', 'STRAIN / %', 'MODE ENTROPY', 'RESOLVE / HZ', 'PHASE'][i], 20 + i * 150, y + 12, mono(11), color);
    text((r() * 100).toFixed(i % 2 ? 1 : 3), 20 + i * 150, y + 34, mono(16), 'rgba(220,230,240,.8)');
  }
}
function sceneTorus(u) {
  band('#060d17');
  hudLabels(3);
  const t = 5.5 + u;
  const cx = 470, cy = BCY - 10, f = 900;
  const rx = .55 + Math.sin(t * 1.3) * .08, ry = Math.sin(t * .9) * .35;
  const proj = (x, y, z) => {
    let y1 = y * Math.cos(rx) - z * Math.sin(rx), z1 = y * Math.sin(rx) + z * Math.cos(rx);
    let x2 = x * Math.cos(ry) + z1 * Math.sin(ry), z2 = -x * Math.sin(ry) + z1 * Math.cos(ry);
    const p = f / (f + z2 + 400); return [cx + x2 * p * 1.55, cy + y1 * p * 1.55];
  };
  const N = 90, M = 36;
  const pt = (i, j) => {
    const th = i / N * Math.PI * 2, ph = j / M * Math.PI * 2 + th * 3;
    const R = 230 + 45 * Math.sin(3 * th), rr_ = 70 + 25 * Math.sin(2 * th + t);
    return proj((R + rr_ * Math.cos(ph)) * Math.cos(th), (R + rr_ * Math.cos(ph)) * Math.sin(th), rr_ * Math.sin(ph));
  };
  ctx.lineWidth = 1;
  for (let j = 0; j < M; j++) {
    ctx.strokeStyle = j % 6 === 0 ? 'rgba(240,170,70,.55)' : 'rgba(90,210,220,.35)';
    ctx.beginPath();
    for (let i = 0; i <= N; i++) { const [x, y] = pt(i, j); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(120,220,230,.18)';
  for (let i = 0; i < N; i += 3) {
    ctx.beginPath();
    for (let j = 0; j <= M; j++) { const [x, y] = pt(i, j); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  // Rechte Seitenleiste
  ctx.strokeStyle = 'rgba(120,150,180,.35)'; ctx.strokeRect(830, BY + 120, 230, 180);
  ctx.strokeStyle = 'rgba(160,200,230,.8)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let a = 0; a <= 64; a++) { const th = a / 64 * Math.PI * 2, rad = 40 + 14 * Math.sin(3 * th + t); const x = 945 + rad * Math.cos(th), y = BY + 210 + rad * Math.sin(th); a ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.lineWidth = 1;
  text('A / CURVATURE', 840, BY + 112, mono(11), 'rgba(160,180,200,.7)');
  const r = rng(4);
  for (let row = 0; row < 3; row++) for (let col = 0; col < 4; col++) {
    ctx.fillStyle = r() > .3 ? 'rgba(230,150,40,.85)' : 'rgba(80,90,110,.6)';
    ctx.fillRect(835 + col * 56, BY + 400 + row * 26, 50, 20);
    text((r() * 9).toFixed(2), 840 + col * 56, BY + 414 + row * 26, mono(10), '#111');
  }
  text('LOCAL DEFORMATION', 835, BY + 390, mono(11), 'rgba(160,180,200,.7)');
  // Untere Panels
  ctx.strokeStyle = 'rgba(120,150,180,.35)'; ctx.beginPath(); ctx.moveTo(0, BY + 780); ctx.lineTo(W, BY + 780); ctx.stroke();
  text('APE SPACE / PRINCIPAL MODES', 10, BY + 800, mono(11), 'rgba(160,180,200,.7)');
  text('LAYER SEPARATION / HISTORY', 370, BY + 800, mono(11), 'rgba(160,180,200,.7)');
  text('TRANSFORMATION SEQUENCE', 720, BY + 800, mono(11), 'rgba(160,180,200,.7)');
  ctx.strokeStyle = 'rgba(200,220,240,.55)';
  for (let k = 0; k < 4; k++) { ctx.beginPath(); for (let x = 0; x < 300; x += 4) { const y = BY + 880 + Math.sin(x / 30 + k + t * 2) * (30 - k * 6) * Math.sin(x / 90); x ? ctx.lineTo(10 + x, y) : ctx.moveTo(10 + x, y); } ctx.stroke(); }
  for (let k = 0; k < 8; k++) { ctx.beginPath(); for (let x = 0; x < 300; x += 4) { const y = BY + 830 + k * 14 + Math.sin(x / 20 + k * .6 + t * 3) * 5; x ? ctx.lineTo(370 + x, y) : ctx.moveTo(370 + x, y); } ctx.stroke(); }
  for (let k = 0; k < 8; k++) text(['01 TWIST', '02 STRETCH', '03 INFLATE', '04 SHEAR', '05 FOLD', '06 UNFOLD', '07 RESET', '08 RELAX'][k], 720, BY + 830 + k * 15, mono(10), 'rgba(200,210,220,.6)');
}

// ── Szene 6: Code mit Glitch ─────────────────────────────────
const CODE_TOP = [
  '\\n\\n--- Performance Metrics ---")',
  '"Prompt: {prompt_tokens} tokens, {prompt_tps:.3f} tokens-per-sec")',
  '"Generation: {generated_tokens} tokens, {generation_tps:.3f} tokens-per-sec")',
  '"Total time: {total_time:.2f} seconds")',
  '"Full response length: {len(full_response)} characters")',
];
const CODE = `.nav-links {
    display: flex;
    gap: 20px;
}
.nav-links a {
    color: white;
    font-weight: 500;
    transition: color 0.3s;
}
.nav-links a:hover {
    color: var(--primary);
}
.cta-button {
    background-color: var(--primary);
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    text-decoration: none;
    transition: background-color 0.3s;
}
.cta-button:hover {
    background-color: var(--secondary);
    cursor: pointer;
}
.mobile-menu {
    display: none;
    font-size: 24px;
    padding: 15px 0 100px;
}
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    text-align: center;
}
.stat-item {
    font-size: 18px;
    margin-bottom: 20px;
    color: var(--light);
}`.split('\n');
function sceneCode(u) {
  band('#2a2a2c');
  ctx.fillStyle = '#1e1e20'; ctx.fillRect(0, BY, W, 150);
  CODE_TOP.forEach((l, i) => text(l, 8, BY + 28 + i * 26, mono(19), i ? '#f2d3a8' : '#ffb07a'));
  ctx.save(); ctx.beginPath(); ctx.rect(0, BY + 150, W, BH - 150); ctx.clip();
  const off = -u * 520;
  const r = rng(Math.floor(u * 24) + 99);
  CODE.concat(CODE).forEach((l, i) => {
    const y = BY + 190 + i * 31 + off;
    if (y < BY + 120 || y > BY + BH + 30) return;
    const jx = r() < .18 ? (r() - .5) * 60 : 0;
    text(l, 10 + jx, y, mono(21), 'rgba(225,225,225,.85)');
    if (r() < .35) { ctx.globalAlpha = .35; text(l, 10 + jx + 4 + r() * 300, y + 2, mono(21), '#bbb'); ctx.globalAlpha = 1; }
  });
  // Slice-Glitch: Streifen horizontal verschieben
  for (let k = 0; k < 7; k++) {
    const sy = BY + 160 + r() * (BH - 200), sh = 6 + r() * 26, dx = (r() - .5) * 140;
    ctx.drawImage(cv, 0, sy, W, sh, dx, sy, W, sh);
  }
  ctx.restore();
}

// ── Szene 7: Sternen-Baum mit leuchtendem Pfad ───────────────
const TREE = (() => {
  const r = rng(21), segs = [];
  function grow(x, y, a, len, d) {
    if (d === 0 || y < BY + 60) return;
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    segs.push([x, y, x2, y2]);
    const n = d > 5 ? 2 : 2 + (r() < .4 ? 1 : 0);
    for (let i = 0; i < n; i++) grow(x2, y2, a + (r() - .5) * .9, len * (.72 + r() * .2), d - 1);
  }
  for (let i = 0; i < 9; i++) grow(60 + i * 120 + r() * 40, BY + BH - 130, -Math.PI / 2 + (r() - .5) * .3, 110, 8);
  const path = []; let x = 700, y = BY + BH - 160;
  while (y > BY + 70) { path.push([x, y]); y -= 22; x += Math.sin(y / 60) * 9 + (r() - .5) * 14 - 2.2; }
  const stars = []; for (let i = 0; i < 700; i++) stars.push([r() * W, BY + r() * BH, r()]);
  return { segs, path, stars };
})();
function sceneStarTree(u) {
  band('#040406');
  for (const [x, y, b] of TREE.stars) { ctx.fillStyle = `rgba(220,220,240,${.15 + b * .5})`; ctx.fillRect(x, y, b * 2 + .6, b * 2 + .6); }
  ctx.strokeStyle = 'rgba(190,195,215,.22)'; ctx.lineWidth = 1; ctx.beginPath();
  for (const [a, b, c, d] of TREE.segs) { ctx.moveTo(a, b); ctx.lineTo(c, d); } ctx.stroke();
  // kleine Fächer unten
  for (let i = 0; i < 8; i++) {
    const fx = 70 + i * 135, fy = BY + BH - 110;
    ctx.strokeStyle = 'rgba(200,200,220,.3)'; ctx.beginPath();
    for (let k = 0; k < 14; k++) { const a = Math.PI + k / 13 * Math.PI; ctx.moveTo(fx, fy); ctx.lineTo(fx + Math.cos(a) * 55, fy + Math.sin(a) * 55); }
    ctx.stroke();
  }
  // leuchtender Pfad (von unten nach oben)
  const p = TREE.path, n = Math.max(2, Math.floor(easeInOut(u / .48) * p.length));
  ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 12; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(...p[i]) : ctx.moveTo(...p[i]); ctx.stroke();
  const [hx, hy] = p[n - 1]; ctx.shadowBlur = 40; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, 9, 0, 7); ctx.fill(); ctx.restore();

// ── Szene 16: Gehirn-Punktwolke ──────────────────────────────
const BRAIN = (() => {
  const r = rng(81), pts = [];
  for (let i = 0; i < 7000; i++) {
    const th = r() * Math.PI * 2, ph = Math.acos(2 * r() - 1);
    let x = Math.sin(ph) * Math.cos(th), y = Math.cos(ph), z = Math.sin(ph) * Math.sin(th);
    const fold = 1 + .06 * Math.sin(th * 9 + ph * 7) + .04 * Math.sin(ph * 13);
    const rad = (.92 + r() * .08) * fold;
    pts.push([x * 1.45 * rad, y * (y > 0 ? 1 : .8) * rad, z * 1.1 * rad, r()]);
  }
  return pts;
})();

function render(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H);
  const sc = TIMELINE.find(([a, b]) => t >= a && t < b);
  if (sc) { ctx.save(); sc[2](t - sc[0]); ctx.restore(); }
}

// ── Player ───────────────────────────────────────────────────
const exportMode = new URLSearchParams(location.search).has('export');
if (exportMode) document.body.classList.add('export');
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`400 52px Inter`), document.fonts.load(`600 52px Inter`), document.fonts.load(`800 44px Inter`),
  document.fonts.load(`500 128px "Source Serif 4"`), document.fonts.load(`400 30px "JetBrains Mono"`), document.fonts.load(`600 30px "JetBrains Mono"`),

if (!exportMode) {
  const playBtn = document.getElementById('play'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
  let playing = true, t0 = performance.now(), cur = 0;
  const toggle = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; if (playing) t0 = performance.now() - cur * 1000; };
  playBtn.onclick = toggle; cv.onclick = toggle;
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  seek.oninput = () => { cur = +seek.value; t0 = performance.now() - cur * 1000; render(cur); timeEl.textContent = cur.toFixed(2); };
  window.ready.then(() => {
    (function loop(now) {
      if (playing) { cur = ((now - t0) / 1000) % LOOP; seek.value = cur; timeEl.textContent = cur.toFixed(2); render(cur); }
      requestAnimationFrame(loop);
    })(performance.now());
  });
}
