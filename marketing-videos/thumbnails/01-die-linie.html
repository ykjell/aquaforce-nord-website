<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("../assets/fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06192b; }
  .img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,16,28,.9) 0%, rgba(4,16,28,.72) 30%, rgba(4,16,28,.1) 52%, rgba(4,16,28,0) 66%, rgba(4,16,28,.75) 100%); }
  h1 { position: absolute; left: 0; top: 290px; width: 1080px; text-align: center; font-family: "Barlow Condensed"; font-weight: 800; font-size: 156px; line-height: .92; text-transform: uppercase; color: #f4f8fb; text-shadow: 0 4px 34px rgba(3,12,22,.6); }
  h1 em { font-style: normal; color: #18c8ff; }
  .logo { position: absolute; left: 330px; top: 1290px; width: 420px; }
</style>
</head>
<body>
  <img class="img" src="../assets/img/lance.jpg" />
  <div class="scrim"></div>
  <h1>Wie viel Dreck<br />steckt in Ihrem<br /><em>Pflaster?</em></h1>
  <img class="logo" src="../assets/img/logo_sticker.png" />
</body>
</html>
