<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("../assets/fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 900; font-style: italic; src: url("../assets/fonts/barlow-condensed-latin-900-italic.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06192b; }
  .img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; object-position: 40% 50%; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,16,28,.92) 0%, rgba(4,16,28,.78) 34%, rgba(4,16,28,.15) 58%, rgba(4,16,28,0) 70%, rgba(4,16,28,.75) 100%); }
  .num { position: absolute; left: 0; top: 250px; width: 1080px; text-align: center; font-family: "Barlow Condensed"; font-weight: 900; font-style: italic; font-size: 400px; line-height: .8; color: #18c8ff; text-shadow: 0 4px 34px rgba(3,12,22,.6); }
  h1 { position: absolute; left: 0; top: 590px; width: 1080px; text-align: center; font-family: "Barlow Condensed"; font-weight: 800; font-size: 150px; line-height: .94; text-transform: uppercase; color: #f4f8fb; text-shadow: 0 4px 34px rgba(3,12,22,.6); }
  h1 em { font-style: normal; color: #18c8ff; }
  .logo { position: absolute; left: 330px; top: 1290px; width: 420px; }
</style>
</head>
<body>
  <img class="img" src="../assets/img/path_before.jpg" />
  <div class="scrim"></div>
  <div class="num">3</div>
  <h1><em>Zeichen,</em> dass<br />Ihr Pflaster<br />überfällig ist</h1>
  <img class="logo" src="../assets/img/logo_sticker.png" />
</body>
</html>
