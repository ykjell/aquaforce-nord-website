<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("../assets/fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 900; font-style: italic; src: url("../assets/fonts/barlow-condensed-latin-900-italic.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(110% 60% at 50% 55%, #0f3d68 0%, #06192b 70%); }
  .marq { position: absolute; left: -40px; top: 1640px; white-space: nowrap; font-family: "Barlow Condensed"; font-weight: 900; font-style: italic; font-size: 330px; line-height: 1; color: transparent; -webkit-text-stroke: 3px rgba(24,200,255,.25); }
  h1 { position: absolute; left: 0; top: 230px; width: 1080px; text-align: center; font-family: "Barlow Condensed"; font-weight: 800; font-size: 168px; line-height: .92; text-transform: uppercase; color: #f4f8fb; }
  h1 em { font-style: normal; color: #18c8ff; }
  .win { position: absolute; left: 250px; top: 590px; width: 580px; height: 1040px; border-radius: 36px; overflow: hidden; border: 6px solid #18c8ff; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .win img { position: absolute; left: 0; top: 0; width: 580px; height: 1040px; object-fit: cover; }
  .logo { position: absolute; left: 350px; top: 1430px; width: 380px; }
</style>
</head>
<body>
  <div class="marq">AQUAFORCE NORD</div>
  <h1>Keine halben<br /><em>Sachen.</em></h1>
  <div class="win"><img src="../assets/img/worker_spray.jpg" /></div>
  <img class="logo" src="../assets/img/logo_sticker.png" />
</body>
</html>
