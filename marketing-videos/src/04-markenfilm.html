    <script>
{{HELPERS}}

      // Bühne: Wortmarke als Kontur läuft durch, Fenster mit dem Profi in Zeitlupe
      tl.fromTo("#marq-in", { x: 0 }, { x: -1500, duration: 6.3, ease: "none" }, 0);
      tl.fromTo("#w1", { scale: 1.18, transformOrigin: "60% 30%" }, { scale: 1.04, duration: 3.3, ease: "power2.out" }, 0);
      tl.fromTo("#t1b", { yPercent: 112 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.3);
      out(["#t1a", "#t1b"], 2.95);

      // Makro-Montage im Fenster, Leistungen rollen durch
      [["#w2", 3.3, "66% 46%"], ["#w3", 4.05, "62% 34%"], ["#w4", 4.8, "50% 40%"], ["#w5", 5.55, "50% 62%"]].forEach(([w, t, o]) => {
        tl.fromTo(w, { scale: 1.5, transformOrigin: o }, { scale: 1.3, duration: 0.75, ease: "power2.out" }, t);
      });
      tl.fromTo("#g2-i", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 3.3);
      tl.fromTo("#g2-in", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.35);
      ["#r1", "#r2", "#r3", "#r4"].forEach((r, i) => {
        const t = 3.3 + i * 0.75;
        tl.fromTo(r, { yPercent: 105 }, { yPercent: 0, duration: 0.3, ease: "power4.out" }, t);
        if (i < 3) tl.to(r, { yPercent: -105, duration: 0.22, ease: "power3.in" }, t + 0.56);
      });
      tl.to("#r4", { yPercent: -105, duration: 0.22, ease: "power3.in" }, 6.05);
      hide("#g2-in", 6.0);

      // Fenster wird zur Welt
      tl.fromTo("#s2", { clipPath: "inset(640px 90px 280px 90px round 40px)" }, { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.7, ease: "power3.inOut" }, 6.2);
      tl.fromTo("#c2", { scale: 1.25, transformOrigin: "50% 55%" }, { scale: 1.04, duration: 3.2, ease: "power2.out" }, 6.2);
      tl.fromTo("#scrim-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.6);
      up(["#t2a", "#t2b"], 6.95);
      out(["#t2a", "#t2b"], 8.95);

      sweep("#s3", "#e3", 9.3, 0.55);
      tl.fromTo("#c3", { scale: 1.14, transformOrigin: "50% 60%" }, { scale: 1.03, duration: 3.5, ease: "power1.out" }, 9.3);
      up(["#t3a", "#t3b"], 9.8);
{{ENDTL 12.6}}
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
